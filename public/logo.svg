<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="SAT Practice">
  <!--
    Brand mark: the lucide graduation cap on a rounded --primary tile.
    Referenced by the Organization JSON-LD's `logo`. Colours are literal
